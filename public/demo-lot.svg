<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="1280" height="1280">
  <defs>
    <pattern id="grass" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#5d7a48"/>
      <circle cx="3" cy="4" r="2.2" fill="#567243"/>
      <circle cx="10" cy="10" r="2.6" fill="#64824d"/>
    </pattern>
    <pattern id="gravel" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#9a9488"/>
      <circle cx="2" cy="2" r="1" fill="#8a8478"/>
      <circle cx="6" cy="5" r="1.2" fill="#a8a296"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#grass)"/>
  <!-- back lane -->
  <rect y="0" width="640" height="44" fill="url(#gravel)"/>
  <!-- street and public sidewalk -->
  <rect y="538" width="640" height="102" fill="#4b4d50"/>
  <rect y="588" width="640" height="2" fill="#c9b458" opacity=".55"/>
  <rect y="522" width="640" height="16" fill="#c4c2bb"/>
  <g stroke="#a9a7a0" stroke-width="1">
    <path d="M40 522v16M80 522v16M120 522v16M160 522v16M200 522v16M240 522v16M280 522v16M320 522v16M360 522v16M400 522v16M440 522v16M480 522v16M520 522v16M560 522v16M600 522v16"/>
  </g>
  <!-- fences / lot lines -->
  <g stroke="#7b6a52" stroke-width="2" opacity=".8">
    <path d="M80 44V400M240 44V400M400 44V400M560 44V400"/>
  </g>
  <g filter="url(#soft)">
    <!-- left neighbour -->
    <rect x="96" y="408" width="56" height="114" fill="#b9b6ae"/>
    <rect x="100" y="254" width="122" height="150" fill="#000" opacity=".25" filter="url(#shadow)"/>
    <rect x="96" y="250" width="122" height="150" fill="#6f5a4d"/>
    <path d="M96 250l61 75 61-75M96 400l61-75 61 75" stroke="#5d4b40" stroke-width="2" fill="none"/>
    <rect x="186" y="400" width="10" height="122" fill="#bdbab2"/>
    <rect x="110" y="70" width="70" height="60" fill="#8d8f92"/>
    <!-- target lot -->
    <rect x="262" y="400" width="60" height="122" fill="#b4b1a9"/>
    <rect x="342" y="400" width="12" height="122" fill="#c2bfb7"/>
    <rect x="266" y="254" width="116" height="150" fill="#000" opacity=".28" filter="url(#shadow)"/>
    <rect x="262" y="250" width="116" height="150" fill="#565b63"/>
    <path d="M262 250l58 75 58-75M262 400l58-75 58 75" stroke="#474b52" stroke-width="2" fill="none"/>
    <rect x="336" y="394" width="24" height="10" fill="#8a7a66"/>
    <rect x="290" y="66" width="80" height="64" fill="#7d7468"/>
    <rect x="276" y="170" width="54" height="40" fill="#a08b6e"/>
    <!-- right neighbour -->
    <rect x="484" y="408" width="58" height="114" fill="#bab7af"/>
    <rect x="424" y="264" width="122" height="140" fill="#000" opacity=".25" filter="url(#shadow)"/>
    <rect x="420" y="260" width="122" height="140" fill="#7a6f66"/>
    <path d="M420 330h122" stroke="#685e56" stroke-width="2"/>
    <rect x="440" y="400" width="10" height="122" fill="#bdbab2"/>
    <rect x="450" y="74" width="74" height="58" fill="#85888c"/>
    <!-- far edges -->
    <rect x="0" y="270" width="62" height="130" fill="#6a6660"/>
    <rect x="578" y="262" width="62" height="138" fill="#5f646b"/>
  </g>
  <!-- trees -->
  <g>
    <circle cx="228" cy="470" r="20" fill="#2f4a2b"/><circle cx="222" cy="464" r="12" fill="#3d5c36"/>
    <circle cx="400" cy="210" r="26" fill="#2f4a2b"/><circle cx="392" cy="202" r="15" fill="#3d5c36"/>
    <circle cx="150" cy="190" r="22" fill="#2c4629"/><circle cx="144" cy="184" r="12" fill="#3a5833"/>
    <circle cx="510" cy="190" r="18" fill="#2f4a2b"/>
    <circle cx="60" cy="470" r="18" fill="#2f4a2b"/>
    <circle cx="600" cy="476" r="16" fill="#2c4629"/>
  </g>
  <!-- parked cars -->
  <rect x="276" y="430" width="22" height="46" rx="6" fill="#20242a"/>
  <rect x="279" y="440" width="16" height="12" rx="2" fill="#5b6b7c"/>
  <rect x="500" y="440" width="22" height="46" rx="6" fill="#8f1f1f"/>
  <rect x="440" y="552" width="48" height="22" rx="6" fill="#d7d9dc"/>
</svg>
